name: Ошибка приложения
description: Сообщить о воспроизводимой ошибке cad-lab
title: "[Ошибка] "
body:
  - type: input
    id: version
    attributes:
      label: Версия cad-lab
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: ОС и версия
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Опишите ожидаемый и фактический результат. Не добавляйте секреты и закрытые модели.
    validations:
      required: true
